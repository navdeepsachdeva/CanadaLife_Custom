- name: Ignore Errors Playbook
  hosts: iosxe1.lab.example.com
  gather_facts: false
  tasks:
    - name: Modify GE3 Description
      ignore_errors: true
      register: output
      cisco.ios.ios_interfaces:
        config:
          - name: GigabitEthernet3
            description: "Hello Daniel"
    - name: Print
      ansible.builtin.debug:
        msg: "{{ output }}"

    - name: Modify GE1 Description
      when: not output.failed
      cisco.ios.ios_interfaces:
        config:
          - name: GigabitEthernet1
            description: "Hello Daniel"

    - name: Modify GE2 Description
      cisco.ios.ios_interfaces:
        config:
          - name: GigabitEthernet2
            description: "Hello Andrew 2"

    - name: Setup motd banner
      cisco.ios.ios_banner:
        banner: motd
        state: present
        text: "Hello Second Day 2"
