# Sections Starts with []
# Under section some parameters


[defaults]
inventory=./canada_systems
collections_path=./collections:~/.ansible/collections:/usr/share/ansible/collections
roles_path=./roles:/etc/ansible/roles:/usr/share/ansible/roles:~/.ansible/roles
remote_user=student
forks=7
host_key_checking=True


[privilege_escalation]
become=false
become_method=ansible.builtin.sudo
become_user=root
become_ask_pass=false

[persistent_connection]
command_timeout=120
connect_retry_timeout=15
connect_timeout=120



[galaxy]
server_list = validated, redhat, published, free

[galaxy_server.published]
url=https://aap.lab.example.com/api/galaxy/content/published/
token=b85535afef3852073d2467f368613c266edf803e


