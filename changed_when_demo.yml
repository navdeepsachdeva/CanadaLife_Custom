- name: changed whenPlaybook
  hosts: iosxe1.lab.example.com
  gather_facts: false
  tasks:
    - name: Setup motd banner
      cisco.ios.ios_banner:
        banner: motd
        state: present
        text: "Hello Third Day 2"
      changed_when: captured.changed == false
      # changed_when: true
      # failed_when: captured.changed == false
      register: captured


    - name: Stop/Continue  Playbook via assert module
      ansible.builtin.assert:
        that:
          - captured.changed == true
          - meme is not defined
        fail_msg: "Previous Output Changed {{ captured.changed }} NOT Expected "
        success_msg: "Hurray Changed {{ captured.changed }} is RIGHT"

    - name: print
      ansible.builtin.debug:
        msg: "{{ captured }}"

    - name: Modify GE1 Description
      cisco.ios.ios_interfaces:
        config:
          - name: GigabitEthernet1
            description: "Hello Daniel"

    - name: Modify GE2 Description
      cisco.ios.ios_interfaces:
        config:
          - name: GigabitEthernet2
            description: "Hello Andrew 2"

