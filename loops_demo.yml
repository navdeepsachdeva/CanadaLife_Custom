- name: Cisco Playbook
  hosts: iosxe1*
  gather_facts: false
  vars_files:
    - ./outside_vars.yml
  # loop was introduced in Ansible 2.5
  tasks:
    - name: Print Simple List
      ansible.builtin.debug:
        msg: "{{ item }}"
      loop: "{{ simple_list }}"
      # with_items: "{{ simple_list }}"


    - name: Print Complex List
      ansible.builtin.debug:
        msg: "{{ item.eth_name }} // {{ item['eth_desc'] }}"
      loop: "{{ complex_list }}"
      # with_list: "{{ complex_list }}"

    - name: Print Nic Dictionary
      ansible.builtin.debug:
        msg: "{{ item['key'] }} ++ {{ item['value'] }}"
      loop: "{{ eth_dict | dict2items }}"
      # with_dict: "{{ eth_dict }}"


    - name: Print Sequence
      ansible.builtin.debug:
        msg: "{{ item }}"
        # msg: "GigabitEthernet{{ item }}"
      with_sequence: start=1 end=4 format=GigabitEthernet%x 



